<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daemons · Work panel</title><link rel="stylesheet" href="/brand.css"><link rel="stylesheet" href="/embed/v1.css"><script type="module" src="/embed/v1.js"></script></head><body><header><strong>Daemons</strong><button id="close" aria-label="Close Daemons panel">×</button></header><main><p id="notice" role="status">Connecting to the app…</p><div id="controls" hidden><label>Daemon<select id="daemon" aria-label="Daemon"></select></label><button id="connect">Connect another Daemon</button><button id="refresh">Refresh</button><button id="disconnect">Disconnect selected connection</button><p id="missing"></p><details><summary>Published instructions</summary><p id="instructions"></p></details><form id="compose"><label>New task<textarea id="task" required maxlength="16000" rows="5"></textarea></label><button type="button" id="attach">Attach page context</button><div id="context" hidden><h3>Page context to attach</h3><pre id="preview"></pre><button type="button" id="remove-context">Remove attachment</button></div><p>Tasks wait for a separately authorized assistant. This panel does not run or wake one.</p><button id="submit">Submit task</button></form><section id="tasks"></section><a href="https://app.daemons.ai" target="_blank" rel="noopener noreferrer">Open full Daemons console ↗</a></div></main></body></html>
